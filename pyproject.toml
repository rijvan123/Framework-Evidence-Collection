[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-pe"
version = "1.0.0"
description = "TRACE-PE: evidence collection and analysis of malware activities with machine learning (Windows PE, EMBER v2 static features, BODMAS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "[Author names to be completed]" }]
keywords = ["digital forensics", "malware", "machine learning", "chain of custody", "concept drift", "conformal prediction"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.5",   # PCA(svd_solver="covariance_eigh")
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end pipeline on a small synthetic release"]
addopts = "-m 'not slow'"
